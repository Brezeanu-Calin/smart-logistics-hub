spring.application.name=smart-logistics
server.port=8080


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SmartLogisticsDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Password123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

routing.depot-city=${DEPOT_CITY:Cluj-Napoca, Romania}
routing.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
routing.nominatim.user-agent=${NOMINATIM_USER_AGENT:SmartLogisticsHub/1.0 (personal project)}
routing.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
routing.return-check-interval-ms=${ROUTE_RETURN_CHECK_INTERVAL_MS:60000}