spring.application.name=smart-logistics
server.port=8080


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SmartLogisticsDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Password123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

routing.google.api-key=${GOOGLE_ROUTES_API_KEY:}
routing.depot-address=${DEPOT_ADDRESS:}
routing.return-check-interval-ms=${ROUTE_RETURN_CHECK_INTERVAL_MS:60000}